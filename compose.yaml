# 本地开发依赖：PostgreSQL
# Setup 会把本地密码仅注入 Compose 子进程，不会在仓库根目录生成 `.env`。
services:
  postgres:
    image: postgres:17-alpine
    container_name: snapbug-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapbug}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请通过 pnpm setup 或进程环境变量提供 PostgreSQL 密码}
    volumes:
      - snapbug-postgres-17-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-snapbug}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  snapbug-postgres-17-data:
    name: snapbug-postgres-17-data
